<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#222326"><title>Macae — Draw & Guess</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-thin-straight/css/uicons-thin-straight.css"><link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-thin-rounded/css/uicons-thin-rounded.css"><link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-straight/css/uicons-solid-straight.css"><link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css"><link rel="stylesheet" href="css/style.css"><script src="js/app.js" defer></script><style>.toolbar .tool i{font-size:20px;line-height:1;display:block}.toolbar .tool{font-size:20px}</style></head><body><main class="app"><section class="game-shell"><header class="game-header"><a class="brand" href="#"><span class="brand-symbol">m</span><span>macae</span><i></i></a><div class="round-center"><div class="timer-wrap"><span class="clock-icon">◷</span><strong id="timer">00:60</strong></div><div class="word-box"><span class="word-caption">GUESS THE WORD</span><strong id="word">_ _ _ _ _ _</strong></div></div><div class="players"><div class="player"><span class="player-avatar pink-avatar">Y</span><span class="player-name">You</span></div><b>VS</b><div class="player"><span class="player-avatar violet-avatar">G</span><span class="player-name">Guest</span></div></div></header><section class="drawing-stage"><div class="canvas-area"><canvas id="board"></canvas><div class="canvas-prompt" id="emptyState"><span>✳</span><strong>Your canvas, your imagination.</strong><small>Pick up your pencil and make something wonderful.</small></div></div><aside class="toolbar" aria-label="Drawing tools">
<button class="tool active" data-tool="pen" title="Pencil"><i class="fi fi-ts-attribution-pencil"></i></button>
<button class="tool" data-tool="eraser" title="Eraser"><i class="fi fi-ts-eraser"></i></button>
<button class="tool" data-tool="select" title="Select"><i class="fi fi-tr-square-dashed"></i></button><span class="tool-divider"></span>
<button class="tool" id="cut" title="Cut"><i class="fi fi-tr-scissors"></i></button>
<button class="tool" id="paste" title="Paste"><i class="fi fi-ts-paste"></i></button><span class="tool-divider"></span>
<button class="tool" id="redo" title="Redo"><i class="fi fi-rr-redo-alt"></i></button>
<button class="tool" id="undo" title="Undo"><i class="fi fi-rr-undo-alt"></i></button><span class="tool-divider"></span>
<div class="more-wrap"><button class="tool" id="moreBtn" title="More"><i class="fi fi-ss-grip-dots"></i></button><div class="more-menu" id="moreMenu"><button id="clearBoard">Clear canvas</button><button id="downloadBoard">Download drawing</button><label>Size <input id="brushSize" type="range" min="2" max="18" value="4"></label><label>Color <input id="inkColor" type="color" value="#65ed78"></label></div></div></aside><div class="guess-strip"><div><span class="guess-spark">✦</span><span>Your drawing tells the story.</span></div><small>DRAWING AREA</small></div></section></section><section class="chat-section"><div class="chat-messages" id="messages"><div class="chat-message"><div class="chat-avatar pink-avatar">Y</div><div class="chat-content"><div class="chat-meta"><strong>You</strong><time>just now</time></div><p>Let's make something fun ✨</p></div></div><div class="chat-message theirs"><div class="chat-avatar violet-avatar">G</div><div class="chat-content"><div class="chat-meta"><strong>Guest</strong><time>just now</time></div><p>I'm ready. Show me what you've got!</p></div></div></div><form class="compose" id="chatForm"><input id="chatInput" maxlength="180" autocomplete="off" placeholder="Say something..." aria-label="Chat message"><button type="button" class="emoji" id="emoji">☺</button><button class="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="m21 3-7.5 18-3.5-7-7-3.5L21 3Z"/></svg></button></form></section><div class="toast" id="toast"></div></main></body></html>
